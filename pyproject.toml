[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serverzen"
version = "0.1.0"
description = "A security toolkit for AI-agent memory runtimes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daniel Balkwill", email = "danielbalkwilld@gmail.com" }]
keywords = ["security", "sast", "ssrf", "appsec", "devsecops", "ai-agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [] # native checks are stdlib-only by design

[project.optional-dependencies]
# Optional external engines ServerZEN can orchestrate.
full = ["semgrep>=1.90", "bandit>=1.7", "pip-audit>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
serverzen = "serverzen.cli:main"

[project.urls]
"Case study" = "https://gitlab.com/ncz-os/mnemos"

[tool.setuptools]
packages = ["serverzen"]
